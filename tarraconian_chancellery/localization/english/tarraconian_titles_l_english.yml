l_english:
 # === Decisions & Events ===
 tarr_chancellery_ordinance_decision:0 "Issue the Tarraconian Chancellery Ordinance"
 tarr_chancellery_ordinance_decision_tooltip:0 "Standardize the names of Imperial and Tarraconian Kingdoms, Governorships, Magistracies, Prince-Bishoprics, and Archdioceses in the Tarraconian court tongue."
 tarr_chancellery_ordinance_decision_desc:0 "Since the union of Lothringian High Franconian and Catalan courtly administration in 989, the scribes of the Imperial Chancellery have rendered the realms, governorships, magistracies, and ecclesiastical sees of Europe in the Tarraconian tongue. By imperial ordinance, we may codify these official registers across the Empire."
 tarr_chancellery_ordinance_decision_confirm:0 "Summon the Imperial Chancellery"
 tarr_chancellery_ordinance_decision_effect_tt:0 "Applies #V Tarraconian#! chancellery toponymy (using #V 1059 Historical Resolutions#! by default, including #V Swenigorot#! for Lemberg) and opens the Chancellery configuration register."

 tarr_chancellery.0001.t:0 "The Imperial Tarraconian Register"
 tarr_chancellery.0001.desc:0 "The Protonotaries of the Imperial Chancellery present the great register of [ROOT.Char.GetCulture.GetNameNoTooltip] toponymy for the year 1059.\n\nUnder the #bold 1059 Historical Resolution#! standard, anachronistic post-1059 castles and colonial towns are replaced by their authentic pre-1059 provincial centres and sub-baronies (such as #italic Vrîsing#! for München, #italic Wilten#! for Innsbruck, #italic Parîs#! for Isle de France, #italic Swenigorot#! for Lemberg, #italic Torschôch#! for Valdai, and #italic Holtzinsel#! for Madeira), while all titles are updated automatically on the 1st of January each year."
 tarr_chancellery.0001.a:0 "Enforce the 1059 Historical Register across the Empire (Default)"
 tarr_chancellery.0001.a.tt:0 "Renames all titles in the #V Holy Roman Empire#! and any #V Tarraconian#! provinces using #V 1059 Historical Resolutions#!."
 tarr_chancellery.0001.b:0 "Extend the 1059 Historical Register to all 44 De Jure Kingdoms"
 tarr_chancellery.0001.b.tt:0 "Renames all 44 De Jure Kingdoms, 198 Duchies, 830 Counties, and 78 Archdioceses (including non-HRE provinces) using #V 1059 Historical Resolutions#!."
 tarr_chancellery.0001.c:0 "Use Direct Toponymic Adaptations in the Empire"
 tarr_chancellery.0001.c.tt:0 "Renames HRE and Tarraconian titles using direct phonological adaptations of their vanilla names rather than pre-1059 historical centres."
 tarr_chancellery.0001.d:0 "Repeal the Ordinance and restore original title names"
 tarr_chancellery.0001.d.tt:0 "Resets all titles renamed by the Tarraconian Chancellery back to their default names."

