# Tarraconian Phonotactics & Chancellery Orthography Specification
# Canonical machine-readable ruleset derived from:
#   - tarraconian_linguistics_guide.md (1194 Chancellery Standard)
#   - sinosphere_phonetics_and_transcription_guide_1154.md
#
# Repository location: data/tarraconian_phonotactics.yaml
# Consumed by: scripts/tarraconian_phonotactics.py (validator),
#              scripts/audit_phonotactics_titles.py (legacy compatibility CLI),
#              scripts/pipeline_stage5_sound_laws.py (normalizer & validator),
#              scripts/pipeline_stage6_disambiguation.py (disambiguation gate),
#              tests/test_data_integrity.py (regression suite)

schema_version: "2.0.0"
standard: "1194 Chancellery Standard"
source_guides:
  - "tarraconian_linguistics_guide.md"
  - "sinosphere_phonetics_and_transcription_guide_1154.md"

# ---------------------------------------------------------------------------
# 1. Orthographic & Phonemic Inventory (§ 2.1 & § 2.2)
# ---------------------------------------------------------------------------
inventory:
  allowed_chars: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzâêîôûÂÊÎÔÛäöüÄÖÜïëÏ '-"

  vowels:
    short: ["a", "e", "i", "o", "u", "y"]
    long: ["â", "ê", "î", "ô", "û"]
    umlaut: ["ä", "ö", "ü"]
    diaeresis: ["ï", "ë"]
    diphthongs: ["ei", "ai", "ay", "ou", "au", "eu", "iu", "îe", "ie", "oe"]

  # Ordered longest-first for greedy Grapheme-to-Phoneme (G2P) tokenization
  grapheme_to_phoneme:
    - { grapheme: "dsch", phoneme: "dʒ", kind: "C" }
    - { grapheme: "tsch", phoneme: "tʃ", kind: "C" }
    - { grapheme: "sch",  phoneme: "ʃ",  kind: "C" }
    - { grapheme: "ch",   phoneme: "x",  kind: "C" }   # palatalized to ç after front vowels
    - { grapheme: "tz",   phoneme: "ts", kind: "C" }
    - { grapheme: "dz",   phoneme: "dz", kind: "C" }   # voiced alveolar affricate (Tibetan/Albanian)
    - { grapheme: "ng",   phoneme: "ŋ",  kind: "C" }
    - { grapheme: "nk",   phoneme: "ŋk", kind: "C" }
    - { grapheme: "nj",   phoneme: "ɲ",  kind: "C" }
    - { grapheme: "ny",   phoneme: "ɲ",  kind: "C" }
    - { grapheme: "nh",   phoneme: "ɲ",  kind: "C" }
    - { grapheme: "lj",   phoneme: "ʎ",  kind: "C" }
    - { grapheme: "ll",   phoneme: "ʎ",  kind: "C" }
    - { grapheme: "ff",   phoneme: "f",  kind: "C" }
    - { grapheme: "tg",   phoneme: "dʒ", kind: "C" }   # Old Catalan substrate variant
    - { grapheme: "ei",   phoneme: "ɛɪ", kind: "V", weight: 2 }
    - { grapheme: "ai",   phoneme: "aɪ", kind: "V", weight: 2 }
    - { grapheme: "ay",   phoneme: "aɪ", kind: "V", weight: 2 }
    - { grapheme: "ou",   phoneme: "ɔʊ", kind: "V", weight: 2 }
    - { grapheme: "au",   phoneme: "ɔʊ", kind: "V", weight: 2 }
    - { grapheme: "eu",   phoneme: "ɔʏ", kind: "V", weight: 2 }
    - { grapheme: "iu",   phoneme: "yː", kind: "V", weight: 2 }
    - { grapheme: "îe",   phoneme: "iː", kind: "V", weight: 2 }
    - { grapheme: "ie",   phoneme: "iə", kind: "V", weight: 2 }
    - { grapheme: "oe",   phoneme: "øː", kind: "V", weight: 2 }
    - { grapheme: "â",    phoneme: "aː", kind: "V", weight: 2 }
    - { grapheme: "ê",    phoneme: "eː", kind: "V", weight: 2 }
    - { grapheme: "î",    phoneme: "iː", kind: "V", weight: 2 }
    - { grapheme: "ô",    phoneme: "oː", kind: "V", weight: 2 }
    - { grapheme: "û",    phoneme: "uː", kind: "V", weight: 2 }
    - { grapheme: "ä",    phoneme: "ɛ",  kind: "V", weight: 1 }
    - { grapheme: "ö",    phoneme: "øː", kind: "V", weight: 2 }
    - { grapheme: "ü",    phoneme: "yː", kind: "V", weight: 2 }
    - { grapheme: "ï",    phoneme: "i",  kind: "V", weight: 1 }
    - { grapheme: "ë",    phoneme: "e",  kind: "V", weight: 1 }
    - { grapheme: "a",    phoneme: "a",  kind: "V", weight: 1 }
    - { grapheme: "e",    phoneme: "ɛ",  kind: "V", weight: 1 }
    - { grapheme: "i",    phoneme: "ɪ",  kind: "V", weight: 1 }
    - { grapheme: "o",    phoneme: "ɔ",  kind: "V", weight: 1 }
    - { grapheme: "u",    phoneme: "ʊ",  kind: "V", weight: 1 }
    - { grapheme: "y",    phoneme: "ɪ",  kind: "V", weight: 1 }
    - { grapheme: "z",    phoneme: "ts", kind: "C" }
    - { grapheme: "c",    phoneme: "k",  kind: "C" }   # ts before e/i/ê/î/y handled in G2P
    - { grapheme: "x",    phoneme: "ks", kind: "C" }
    - { grapheme: "g",    phoneme: "ɡ",  kind: "C" }
    - { grapheme: "b",    phoneme: "b",  kind: "C" }
    - { grapheme: "d",    phoneme: "d",  kind: "C" }
    - { grapheme: "f",    phoneme: "f",  kind: "C" }
    - { grapheme: "h",    phoneme: "h",  kind: "C" }
    - { grapheme: "j",    phoneme: "j",  kind: "C" }
    - { grapheme: "k",    phoneme: "k",  kind: "C" }
    - { grapheme: "l",    phoneme: "l",  kind: "C" }
    - { grapheme: "m",    phoneme: "m",  kind: "C" }
    - { grapheme: "n",    phoneme: "n",  kind: "C" }
    - { grapheme: "p",    phoneme: "p",  kind: "C" }
    - { grapheme: "q",    phoneme: "k",  kind: "C" }   # qu+vowel -> kw handled in G2P
    - { grapheme: "r",    phoneme: "r",  kind: "C" }
    - { grapheme: "s",    phoneme: "s",  kind: "C" }
    - { grapheme: "t",    phoneme: "t",  kind: "C" }
    - { grapheme: "v",    phoneme: "v",  kind: "C" }
    - { grapheme: "w",    phoneme: "w",  kind: "C" }

  # Sonority hierarchy for onset rise / coda fall / Syllable Contact Law
  # 1=stop, 2=affricate, 3=fricative, 4=nasal, 5=liquid, 6=glide, 7=vowel
  sonority:
    p: 1
    b: 1
    t: 1
    d: 1
    k: 1
    ɡ: 1
    ts: 2
    dz: 2
    tʃ: 2
    dʒ: 2
    f: 3
    v: 3
    s: 3
    z: 3
    ʃ: 3
    ç: 3
    x: 3
    h: 3
    m: 4
    n: 4
    ɲ: 4
    ŋ: 4
    l: 5
    ʎ: 5
    r: 5
    j: 6
    w: 6

# ---------------------------------------------------------------------------
# 2. Morpheme & Compound Boundary Segmentation
# ---------------------------------------------------------------------------
morphology:
  # Administrative / title prefixes stripped before stem phonotactics
  title_prefixes:
    - "Kûnincrich"
    - "Gubernat"
    - "Keiserrîch"
    - "Magistrat"
    - "Erzbisdom"
    - "Fürstbisdom"
    - "Regenat"
    - "Veguerîe"
    - "Herzogamt"
    - "Bisbalîe"

  # Grammatical particles exempt from stem-level stress / apocope checks
  lowercase_particles:
    - "van"
    - "vom"
    - "von"
    - "am"
    - "an"
    - "in"
    - "im"
    - "der"
